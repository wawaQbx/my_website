  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

s:50%;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.06);color:#e8ede2;font-size:18px;cursor:pointer;line-height:1;\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.12);border-radius:14px;overflow:hidden;background:rgba(0,0,0,0.2);\">\n          <canvas id=\"factor-zoom\" style=\"display:block;width:100%;\"><\u002Fcanvas>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(232,237,226,0.7);\">\n          low <span style=\"width:120px;height:9px;border-radius:4px;background:linear-gradient(90deg,#14301c,#2c6b42,#78d69c,#d9f0a8,#ffe08a);display:inline-block;\"><\u002Fspan> high — {{ zoomHint }}\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- nav -->\n  <nav style=\"position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(20px,5vw,48px);background:rgba(16,42,22,0.72);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.08);\">\n    <a href=\"Barcelona GIS Hub.dc.html\" style=\"display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:#f2f3ec;font-size:14px;font-weight:500;\">\n      <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 19-7-7 7-7\"><\u002Fpath><path d=\"M19 12H5\"><\u002Fpath><\u002Fsvg>\n      Barcelona GIS overview\n    <\u002Fa>\n    <a href=\"personal web.dc.html#top\" style=\"display:flex;align-items:center;gap:8px;text-decoration:none;color:#f2f3ec;\">\n      <span style=\"width:9px;height:9px;border-radius:50%;background:#78d69c;display:inline-block;\"><\u002Fspan>\n      <span style=\"font-size:16px;font-weight:600;letter-spacing:-0.02em;\">Ziyue Zhou<\u002Fspan>\n    <\u002Fa>\n  <\u002Fnav>\n\n  <div style=\"position:relative;z-index:1;\">\n\n  <!-- hero -->\n  <header data-screen-label=\"Hero\" style=\"padding:clamp(70px,10vw,120px) clamp(24px,6vw,96px) clamp(48px,6vw,72px);\">\n    <div style=\"max-width:1080px;margin:0 auto;\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:26px;\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#78d69c;background:rgba(120,214,156,0.16);padding:6px 13px;border-radius:9999px;\">Barcelona GIS · Analysis 02<\u002Fspan>\n        <span style=\"font-size:12px;font-weight:500;letter-spacing:0.08em;color:rgba(232,237,226,0.6);padding:6px 4px;\">966 stores · 43 markets · 10 factors · 1,068 sections<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.0;letter-spacing:-0.01em;color:#fff;font-size:clamp(2.8rem,7vw,5rem);text-wrap:balance;\">Supermarket Site Selection<\u002Fh1>\n      <p style=\"margin:26px 0 0;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.6;color:rgba(238,242,232,0.86);max-width:60ch;\">From competitive landscape to weighted suitability. Reading the location logic of every major chain, then combining ten factor layers spanning demand, tourism, competition gaps, access and affordability into a live multi-criteria siting model.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"max-width:1080px;margin:0 auto;padding:0 clamp(24px,6vw,96px) clamp(80px,9vw,120px);\">\n\n    <!-- 01 competitive landscape -->\n    <section data-screen-label=\"01 Competitive Landscape\" style=\"margin-top:clamp(24px,4vw,40px);\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:16px;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(232,237,226,0.5);\">01<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:600;color:#fff;line-height:1.08;\">The Competitive Landscape<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 18px;font-size:1rem;line-height:1.7;color:rgba(232,237,226,0.78);max-width:70ch;\">966 store locations across 15 brands and 10 retail groups (2026). Toggle a group to hide it; expand <span style=\"font-family:'JetBrains Mono',monospace;font-size:0.85em;\">▸<\u002Fspan> to show or hide individual sub-brands. Add context overlays to read stores against fresh-food markets, shopping centres and transit.<\u002Fp>\n\n      <!-- group / sub-brand legend -->\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;\">\n        <sc-for list=\"{{ legend }}\" as=\"g\" hint-placeholder-count=\"10\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:6px;\">\n            <div style=\"display:flex;align-items:center;gap:4px;\">\n              <button onclick=\"{{ g.toggleGroup }}\" style=\"display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:6px 10px;border-radius:8px;border:none;background:transparent;color:{{ g.textColor }};cursor:pointer;opacity:{{ g.opacity }};\">\n                <span style=\"width:9px;height:9px;border-radius:50%;background:{{ g.color }};display:inline-block;flex:none;\"><\u002Fspan>\n                {{ g.name }} · {{ g.count }}\n              <\u002Fbutton>\n              <sc-if value=\"{{ g.hasSub }}\" hint-placeholder-val=\"{{ true }}\">\n                <button onclick=\"{{ g.toggleExpand }}\" style=\"flex:none;width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.05);color:rgba(232,237,226,0.7);font-size:10px;cursor:pointer;line-height:1;\">{{ g.caret }}<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ g.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:5px;padding:0 4px 4px;\">\n                <sc-for list=\"{{ g.brands }}\" as=\"b\" hint-placeholder-count=\"2\">\n                  <button onclick=\"{{ b.toggle }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:4px 9px;border-radius:7px;border:1px solid {{ b.border }};background:{{ b.bg }};color:{{ b.textColor }};cursor:pointer;\">{{ b.name }} · {{ b.count }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- context overlays -->\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(232,237,226,0.5);margin-right:2px;\">Overlay<\u002Fspan>\n        <sc-for list=\"{{ overlays }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <button onclick=\"{{ o.toggle }}\" style=\"display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 11px;border-radius:8px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.textColor }};cursor:pointer;\">\n            <span style=\"width:9px;height:9px;background:{{ o.color }};display:inline-block;flex:none;{{ o.shape }}\"><\u002Fspan>\n            {{ o.name }} · {{ o.count }}\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid rgba(255,255,255,0.12);border-radius:16px;overflow:hidden;background:rgba(0,0,0,0.18);\">\n        <canvas id=\"map-landscape\" style=\"display:block;width:100%;\"><\u002Fcanvas>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;\">\n        <sc-for list=\"{{ findings }}\" as=\"fd\" hint-placeholder-count=\"6\">\n          <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 18px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#78d69c;margin-bottom:8px;\">{{ fd.tag }}<\u002Fdiv>\n            <p style=\"margin:0;font-size:0.92rem;line-height:1.65;color:rgba(232,237,226,0.82);\">{{ fd.text }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:16px;display:flex;gap:14px;background:rgba(120,214,156,0.08);border:1px solid rgba(120,214,156,0.22);border-left:3px solid #78d69c;border-radius:12px;padding:16px 20px;\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#78d69c\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:2px;\"><path d=\"M9 18h6\"><\u002Fpath><path d=\"M10 22h4\"><\u002Fpath><path d=\"M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14\"><\u002Fpath><\u002Fsvg>\n        <p style=\"margin:0;font-size:0.98rem;line-height:1.7;color:rgba(232,237,226,0.86);\">Mid- and large-format supermarket density tracks population density almost proportionally — the network is likely near saturation. Opportunity is therefore about <em>where the pattern breaks<\u002Fem>: turn on the market overlay and note how the 43 municipal markets fill much of the apparent chain gap in Ciutat Vella and Sant Andreu. The weighted model below accounts for both.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 02 factor layers -->\n    <section data-screen-label=\"02 Factor Layers\" style=\"margin-top:clamp(56px,7vw,88px);\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:16px;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(232,237,226,0.5);\">02<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:600;color:#fff;line-height:1.08;\">Ten Factor Layers<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 22px;font-size:1rem;line-height:1.7;color:rgba(232,237,226,0.78);max-width:70ch;\">Each factor is computed per census section and rank-normalised to 0–1, so no skewed distribution dominates the composite. Brighter means a higher score. Click any layer to enlarge it.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;\">\n        <sc-for list=\"{{ factorMeta }}\" as=\"fm\" hint-placeholder-count=\"10\">\n          <button onclick=\"{{ fm.open }}\" style=\"text-align:left;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px;cursor:zoom-in;transition:border-color .15s,transform .15s;\" style-hover=\"border-color:rgba(120,214,156,0.4);transform:translateY(-2px);\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;height:29px;\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.3;letter-spacing:0.06em;text-transform:uppercase;color:#78d69c;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;\">{{ fm.code }} · {{ fm.name }}<\u002Fspan>\n              <span style=\"font-size:14px;color:rgba(232,237,226,0.35);line-height:1.3;flex:none;\">⤢<\u002Fspan>\n            <\u002Fdiv>\n            <canvas id=\"{{ fm.canvasId }}\" style=\"display:block;width:100%;border-radius:8px;\"><\u002Fcanvas>\n            <p style=\"margin:10px 0 0;font-size:0.82rem;line-height:1.5;color:rgba(232,237,226,0.62);\">{{ fm.desc }}<\u002Fp>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 03 weighted suitability -->\n    <section data-screen-label=\"03 Weighted Suitability\" style=\"margin-top:clamp(56px,7vw,88px);\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:16px;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(232,237,226,0.5);\">03<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:600;color:#fff;line-height:1.08;\">Weighted Suitability — Live Model<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 20px;font-size:1rem;line-height:1.7;color:rgba(232,237,226,0.78);max-width:70ch;\">Composite score = weighted sum of the ten normalised factors. Rather than ten separate dials, weight moves in five themes — demand, tourism, competition gap, access and affordability — each spreading its budget across its members by a fixed ratio. Drag a theme; map and candidate list recompute instantly. Expand to fine-tune all ten factors, or use a preset to jump to a brand's strategy.<\u002Fp>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(232,237,226,0.5);align-self:center;margin-right:2px;\">Preset<\u002Fspan>\n        <sc-for list=\"{{ presets }}\" as=\"pr\" hint-placeholder-count=\"4\">\n          <button onclick=\"{{ pr.apply }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;padding:7px 13px;border-radius:8px;border:1px solid {{ pr.border }};background:{{ pr.bg }};color:{{ pr.textColor }};cursor:pointer;\">{{ pr.name }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px;\">\n        <sc-for list=\"{{ groupSliders }}\" as=\"g\" hint-placeholder-count=\"5\">\n          <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 14px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:3px;\">\n              <span style=\"display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:rgba(232,237,226,0.85);\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ g.color }};display:inline-block;flex:none;\"><\u002Fspan>{{ g.name }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:{{ g.color }};\">{{ g.value }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(232,237,226,0.45);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ g.memberNames }}<\u002Fdiv>\n            <input type=\"range\" min=\"0\" max=\"70\" step=\"2\" value=\"{{ g.value }}\" oninput=\"{{ g.onInput }}\" style=\"width:100%;margin:0;\">\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <button onclick=\"{{ toggleAdvanced }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;padding:7px 13px;border-radius:8px;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.04);color:rgba(232,237,226,0.7);cursor:pointer;margin-bottom:16px;\">\n        <sc-if value=\"{{ advanced }}\" hint-placeholder-val=\"{{ false }}\">▾ Hide the 10 individual factors<\u002Fsc-if>\n        <sc-if value=\"{{ notAdvanced }}\" hint-placeholder-val=\"{{ true }}\">▸ Fine-tune all 10 factors<\u002Fsc-if>\n      <\u002Fbutton>\n\n      <sc-if value=\"{{ advanced }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;\">\n          <sc-for list=\"{{ sliders }}\" as=\"sl\" hint-placeholder-count=\"10\">\n            <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:11px 13px;\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:7px;\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.04em;text-transform:uppercase;color:rgba(232,237,226,0.7);\">{{ sl.name }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#78d69c;\">{{ sl.value }}<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"0\" max=\"40\" step=\"2\" value=\"{{ sl.value }}\" oninput=\"{{ sl.onInput }}\" style=\"width:100%;margin:0;\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr);gap:14px;align-items:stretch;\">\n        <div style=\"position:relative;border:1px solid rgba(255,255,255,0.12);border-radius:16px;overflow:hidden;background:rgba(0,0,0,0.18);\">\n          <canvas id=\"map-suit\" style=\"display:block;width:100%;cursor:crosshair;\"><\u002Fcanvas>\n          <div id=\"suit-tip\" style=\"position:absolute;display:none;pointer-events:none;background:rgba(12,30,17,0.95);border:1px solid rgba(120,214,156,0.4);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.55;color:#e8ede2;max-width:230px;z-index:5;\"><\u002Fdiv>\n          <div style=\"position:absolute;left:12px;bottom:10px;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(232,237,226,0.75);background:rgba(12,30,17,0.7);padding:5px 10px;border-radius:8px;\">\n            low <span style=\"width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,#14301c,#2c6b42,#78d69c,#d9f0a8,#ffe08a);display:inline-block;\"><\u002Fspan> high · top {{ candidateCount }} outlined\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:2px;min-height:300px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#78d69c;margin-bottom:10px;\">Top candidate sections<\u002Fdiv>\n          <sc-for list=\"{{ topCandidates }}\" as=\"c\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.07);\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(232,237,226,0.5);\">{{ c.rank }}<\u002Fspan>\n              <div style=\"min-width:0;\">\n                <div style=\"font-size:0.9rem;font-weight:500;color:#f2f3ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ c.barri }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(232,237,226,0.5);\">{{ c.district }} · sec {{ c.sec }} · {{ c.dS }} chains ≤800m · {{ c.dM }}m market<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#ffe08a;\">{{ c.score }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <p style=\"margin:12px 0 0;font-size:0.78rem;line-height:1.5;color:rgba(232,237,226,0.5);\">Sections with fewer than {{ minPopulation }} residents excluded.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;\">\n        <div style=\"background:rgba(120,214,156,0.08);border:1px solid rgba(120,214,156,0.22);border-radius:14px;padding:16px 20px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#78d69c;margin-bottom:8px;\">Method<\u002Fdiv>\n          <p style=\"margin:0;font-size:0.92rem;line-height:1.65;color:rgba(232,237,226,0.82);\">Ten factors, each rank-normalised per section (0–1), combined linearly with the weights above. Chain competition is a Gaussian density of stores within a ~500 m walking radius (fewer nearby scores higher), while market gap and transit use nearest-neighbour distance from each section's centroid. Tourist pressure is split into licensed apartments (HUTs) and hotels; retail under-supply is residents per commercial premise. Affordability is the inverted commercial rent per m², so a cheaper premise raises suitability — the one cost term balancing the otherwise all-upside factors.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 20px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(232,237,226,0.6);margin-bottom:8px;\">Limitations<\u002Fdiv>\n          <p style=\"margin:0;font-size:0.92rem;line-height:1.65;color:rgba(232,237,226,0.72);\">The competition layer now includes 43 municipal markets alongside chains, but independent greengrocers and small fresh-food shops are still not captured, so the market-gap factor mildly overstates opportunity. Store floor area, parking, slope and logistics access are not modelled. Store data spans the metro area; sections cover the municipality. Reference model, not a definitive commercial source.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- pager -->\n    <div style=\"margin-top:clamp(48px,6vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;\">\n      <a href=\"GIS Population Distribution.dc.html\" style=\"display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:24px 26px;text-decoration:none;transition:border-color .2s,transform .2s;\" style-hover=\"border-color:rgba(120,214,156,0.45);transform:translateY(-3px);\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;color:rgba(232,237,226,0.55);\">← PREVIOUS ANALYSIS<\u002Fspan>\n        <span style=\"font-family:'Cormorant Garamond',Georgia,serif;font-size:1.5rem;font-weight:600;color:#f2f3ec;line-height:1.1;\">Population Distribution by Age Group<\u002Fspan>\n      <\u002Fa>\n      <a href=\"Barcelona GIS Hub.dc.html\" style=\"display:flex;flex-direction:column;gap:10px;align-items:flex-end;text-align:right;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:24px 26px;text-decoration:none;transition:border-color .2s,transform .2s;\" style-hover=\"border-color:rgba(120,214,156,0.45);transform:translateY(-3px);\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;color:rgba(232,237,226,0.55);\">PROJECT OVERVIEW →<\u002Fspan>\n        <span style=\"font-family:'Cormorant Garamond',Georgia,serif;font-size:1.5rem;font-weight:600;color:#f2f3ec;line-height:1.1;\">Barcelona GIS Hub<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n\n    <!-- back to work -->\n    <div style=\"margin-top:clamp(40px,5vw,56px);padding-top:32px;border-top:1px solid rgba(255,255,255,0.12);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;\">\n      <a href=\"personal web.dc.html#work\" style=\"display:inline-flex;align-items:center;gap:9px;background:#f2f3ec;color:#1f2a1d;font-size:15px;font-weight:600;padding:13px 24px;border-radius:9999px;text-decoration:none;transition:transform .15s;\" style-hover=\"transform:translateY(-2px);\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 19-7-7 7-7\"><\u002Fpath><path d=\"M19 12H5\"><\u002Fpath><\u002Fsvg>\n        All projects\n      <\u002Fa>\n      <span style=\"font-size:13px;color:rgba(232,237,226,0.5);\">© 2026 Ziyue Zhou<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;candidateCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:3,&quot;max&quot;:25,&quot;section&quot;:&quot;Model&quot;},&quot;minPopulation&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:500,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:2000,&quot;step&quot;:100,&quot;section&quot;:&quot;Model&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    loaded: false,\n    weights: [25, 12, 8, 8, 6, 8, 15, 10, 8, 8],\n    advanced: false,   // reveal the 10 atomic sliders\n    hiddenBrand: {},   // brand name -> true\n    expanded: {},      // group idx -> true\n    overlay: { markets: false, centres: false, transit: false },\n    zoom: null         // factor index or null\n  };\n\n  GROUP_COLORS = {\n    'Aldi Group': '#56c8e8', 'Auchan Group': '#ff7a66', 'Bon Preu Group': '#6be3c0',\n    'Carrefour Group': '#5f7fff', 'Condis Group': '#b4e878', 'Consum Group': '#ffb26b',\n    'Dia Group': '#ff8fa3', 'Eroski Group': '#c9a0ff', 'Lidl Group': '#ffd166', 'Mercadona': '#f8f8f2'\n  };\n  OVL = { markets: '#ff9d5c', centres: '#c9a0ff', transit: '#8fd0ff' };\n\n  FACTORS = [\n    { code: 'F1', name: 'Demand', desc: 'Population density per census section (residents / km², padró 2026).', key: 'den', hint: 'residents per km²' },\n    { code: 'F2', name: 'Purchasing power', desc: 'Household income per capita (€ / year), renda dataset.', key: 'inc', hint: 'income per capita' },\n    { code: 'F3', name: 'Higher education', desc: 'Share of residents 16+ with higher education.', key: 'edu', hint: '% higher education' },\n    { code: 'F4', name: 'Tourist apartments', desc: 'Licensed tourist apartments (HUTs) per section.', key: 'hu', hint: 'HUTs per section' },\n    { code: 'F5', name: 'Hotels', desc: 'Hotel count per section.', key: 'ho', hint: 'hotels per section' },\n    { code: 'F6', name: 'Transit access', desc: 'Proximity to the nearest Metro, FGC, Rodalies or TRAM stop.', key: 'dT', hint: 'closer = brighter' },\n    { code: 'F7', name: 'Chain competition', desc: 'Density of chain stores within a ~500 m walking radius, inverted so fewer competitors nearby scores higher.', key: 'dS', hint: 'fewer nearby = brighter' },\n    { code: 'F8', name: 'Market gap', desc: 'Distance to the nearest municipal market.', key: 'dM', hint: 'farther = brighter' },\n    { code: 'F9', name: 'Retail undersupply', desc: 'Residents per commercial premise.', key: 'hpc', hint: 'residents per shop' },\n    { code: 'F10', name: 'Affordability', desc: 'Commercial rent per m² (2026), inverted so cheaper premises score higher.', key: 'cp', hint: 'cheaper rent = brighter' }\n  ];\n\n  // thematic grouping — coarse control; each group distributes its budget to members by fixed ratio\n  GROUPS = [\n    { name: 'Demand', members: [0, 1, 2], color: '#78d69c' },\n    { name: 'Tourism', members: [3, 4], color: '#ffb26b' },\n    { name: 'Competition gap', members: [6, 7, 8], color: '#8fd0ff' },\n    { name: 'Access', members: [5], color: '#c9a0ff' },\n    { name: 'Affordability', members: [9], color: '#ffe08a' }\n  ];\n\n  PRESETS = [\n    { name: 'Balanced', w: [25, 12, 8, 8, 6, 8, 15, 10, 8, 8] },\n    { name: 'Caprabo (affluent loyal)', w: [16, 24, 20, 4, 4, 6, 12, 8, 6, 4] },\n    { name: 'Dia (fill the gaps)', w: [22, 4, 2, 6, 6, 6, 22, 20, 12, 16] },\n    { name: 'Mi Alcampo (tourist)', w: [8, 8, 6, 22, 24, 14, 8, 6, 4, 6] },\n    { name: 'Mercadona (mass coverage)', w: [30, 10, 4, 4, 4, 12, 18, 12, 6, 10] }\n  ];\n\n  componentDidMount() {\n    fetch(window.__resources ? window.__resources.sitingData : 'gis/siting-data.json').then(r => r.json()).then(data => {\n      this.data = data;\n      const [minLon, minLat, maxLon, maxLat] = data.bbox;\n      this.KX = 111320 * Math.cos(41.39 * Math.PI / 180); this.KY = 110540;\n      this.Wm = (maxLon - minLon) * this.KX; this.Hm = (maxLat - minLat) * this.KY;\n      for (const s of data.sections) {\n        let a = 999, b = 999, c = -999, d = -999;\n        for (const ring of s.p) for (let i = 0; i < ring.length; i += 2) {\n          if (ring[i] < a) a = ring[i]; if (ring[i] > c) c = ring[i];\n          if (ring[i + 1] < b) b = ring[i + 1]; if (ring[i + 1] > d) d = ring[i + 1];\n        }\n        s.bb = [a, b, c, d];\n      }\n      this.groupCounts = data.groups.map((g, i) => data.stores.filter(st => st[2] === i).length);\n      this.brandCounts = {};\n      for (const st of data.stores) this.brandCounts[st[3]] = (this.brandCounts[st[3]] || 0) + 1;\n      this.mktCounts = data.mtypes.map((t, i) => data.markets.filter(m => m[2] === i).length);\n      this.setState({ loaded: true }, () => { this.drawAll(); this.bindHover(); });\n      this._onResize = () => this.drawAll();\n      window.addEventListener('resize', this._onResize);\n    });\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }\n  componentDidUpdate(pp, ps) {\n    if (ps.zoom !== this.state.zoom && this.state.zoom != null) {\n      requestAnimationFrame(() => this.drawZoom());\n    }\n  }\n\n  fit(canvas) {\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    const w = canvas.clientWidth || canvas.parentElement.clientWidth;\n    const h = w * this.Hm / this.Wm;\n    canvas.style.height = h + 'px';\n    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);\n    const scale = canvas.width / this.Wm;\n    const [minLon, , , maxLat] = this.data.bbox;\n    return { ctx: canvas.getContext('2d'), scale, minLon, maxLat, w: canvas.width, h: canvas.height };\n  }\n  px(T, lon, lat) { return [(lon - T.minLon) * this.KX * T.scale, (T.maxLat - lat) * this.KY * T.scale]; }\n  ramp(t) {\n    const s = [[20, 48, 28], [44, 107, 66], [120, 214, 156], [217, 240, 168], [255, 224, 138]];\n    const x = Math.max(0, Math.min(1, t)) * (s.length - 1);\n    const i = Math.min(Math.floor(x), s.length - 2), f = x - i;\n    const c = s[i].map((v, k) => Math.round(v + (s[i + 1][k] - v) * f));\n    return 'rgb(' + c.join(',') + ')';\n  }\n  tracePolys(ctx, T, s) {\n    ctx.beginPath();\n    for (const ring of s.p) {\n      for (let i = 0; i < ring.length; i += 2) {\n        const [x, y] = this.px(T, ring[i], ring[i + 1]);\n        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n      }\n      ctx.closePath();\n    }\n  }\n  drawChoro(canvas, valFn, highlightIds) {\n    if (!canvas || !this.data) return null;\n    const T = this.fit(canvas), ctx = T.ctx;\n    ctx.clearRect(0, 0, T.w, T.h);\n    for (const s of this.data.sections) {\n      this.tracePolys(ctx, T, s);\n      ctx.fillStyle = this.ramp(valFn(s)); ctx.fill();\n      ctx.strokeStyle = 'rgba(10,25,14,0.55)'; ctx.lineWidth = 0.5; ctx.stroke();\n    }\n    if (highlightIds) {\n      ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = Math.max(1.5, T.w / 700);\n      for (const s of this.data.sections) if (highlightIds.has(s.i)) { this.tracePolys(ctx, T, s); ctx.stroke(); }\n    }\n    return T;\n  }\n  pt(ctx, x, y, r, shape) {\n    ctx.beginPath();\n    if (shape === 'square') ctx.rect(x - r, y - r, r * 2, r * 2);\n    else if (shape === 'diamond') { ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }\n    else ctx.arc(x, y, r, 0, 7);\n    ctx.fill();\n  }\n  drawLandscape() {\n    const canvas = document.getElementById('map-landscape');\n    if (!canvas || !this.data) return;\n    const T = this.fit(canvas), ctx = T.ctx;\n    ctx.clearRect(0, 0, T.w, T.h);\n    for (const s of this.data.sections) {\n      this.tracePolys(ctx, T, s);\n      ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fill();\n      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 0.5; ctx.stroke();\n    }\n    const ov = this.state.overlay;\n    // transit (under stores)\n    if (ov.transit) {\n      ctx.fillStyle = this.OVL.transit; ctx.globalAlpha = 0.7;\n      const r = Math.max(1.6, T.w / 620);\n      for (const st of this.data.stations) { const [x, y] = this.px(T, st[0], st[1]); this.pt(ctx, x, y, r, 'circle'); }\n      ctx.globalAlpha = 1;\n    }\n    // stores\n    const r = Math.max(2.2, T.w / 420);\n    for (const st of this.data.stores) {\n      if (this.state.hiddenBrand[st[3]]) continue;\n      const [x, y] = this.px(T, st[0], st[1]);\n      ctx.fillStyle = this.GROUP_COLORS[this.data.groups[st[2]]] || '#fff';\n      ctx.globalAlpha = 0.9; this.pt(ctx, x, y, r, 'circle'); ctx.globalAlpha = 1;\n    }\n    // markets / centres (over stores)\n    const mr = Math.max(3, T.w / 320);\n    if (ov.markets) {\n      ctx.fillStyle = this.OVL.markets;\n      for (const m of this.data.markets) if (m[2] === 0) { const [x, y] = this.px(T, m[0], m[1]); this.pt(ctx, x, y, mr, 'square'); }\n    }\n    if (ov.centres) {\n      ctx.fillStyle = this.OVL.centres;\n      for (const m of this.data.markets) if (m[2] === 2) { const [x, y] = this.px(T, m[0], m[1]); this.pt(ctx, x, y, mr, 'diamond'); }\n    }\n  }\n  scores() {\n    const w = this.state.weights, tot = w.reduce((a, b) => a + b, 0) || 1;\n    return this.data.sections.map(s => s.f.reduce((a, f, j) => a + f * w[j], 0) / tot);\n  }\n  drawSuit() {\n    if (!this.data) return;\n    const sc = this.scores();\n    const n = this.props.candidateCount ?? 8;\n    const minPop = this.props.minPopulation ?? 500;\n    const ranked = this.data.sections.map((s, i) => [sc[i], s]).sort((a, b) => b[0] - a[0]);\n    const top = new Set(ranked.filter(x => x[1].pop >= minPop).slice(0, n).map(x => x[1].i));\n    const byId = new Map(this.data.sections.map((s, i) => [s.i, sc[i]]));\n    this._scoreById = byId;\n    this._suitT = this.drawChoro(document.getElementById('map-suit'), s => byId.get(s.i), top);\n  }\n  drawFactor(canvas, j) {\n    const col = this.data.sections.map(s => s.f[j]);\n    const byId = new Map(this.data.sections.map((s, i) => [s.i, col[i]]));\n    return this.drawChoro(canvas, s => byId.get(s.i));\n  }\n  drawZoom() {\n    const j = this.state.zoom;\n    if (j == null) return;\n    this.drawFactor(document.getElementById('factor-zoom'), j);\n  }\n  drawAll() {\n    this.drawLandscape();\n    this.FACTORS.forEach((f, j) => this.drawFactor(document.getElementById('factor-' + j), j));\n    this.drawSuit();\n    if (this.state.zoom != null) this.drawZoom();\n  }\n\n  bindHover() {\n    const canvas = document.getElementById('map-suit');\n    const tip = document.getElementById('suit-tip');\n    if (!canvas || !tip) return;\n    canvas.addEventListener('mousemove', e => {\n      const T = this._suitT; if (!T) return;\n      const rect = canvas.getBoundingClientRect();\n      const dpr = canvas.width / rect.width;\n      const mx = (e.clientX - rect.left) * dpr, my = (e.clientY - rect.top) * dpr;\n      const lon = mx / (this.KX * T.scale) + T.minLon;\n      const lat = T.maxLat - my / (this.KY * T.scale);\n      let hit = null;\n      for (const s of this.data.sections) {\n        if (lon < s.bb[0] || lon > s.bb[2] || lat < s.bb[1] || lat > s.bb[3]) continue;\n        if (this.pip(s, lon, lat)) { hit = s; break; }\n      }\n      if (!hit) { tip.style.display = 'none'; return; }\n      const score = this._scoreById ? this._scoreById.get(hit.i) : 0;\n      tip.innerHTML = '<strong style=\"color:#fff\">' + hit.b + '<\u002Fstrong><br>' +\n        '<span style=\"font-family:JetBrains Mono,monospace;font-size:11px;color:rgba(232,237,226,0.6)\">' + hit.d + ' · sec ' + hit.s + '<\u002Fspan><br>' +\n        'score <span style=\"color:#ffe08a\">' + score.toFixed(3) + '<\u002Fspan> · ' + hit.pop.toLocaleString() + ' residents<br>' +\n        hit.cn + ' chains ≤800m · ' + hit.dM + 'm to market · ' + hit.dT + 'm to transit';\n      tip.style.display = 'block';\n      const tx = e.clientX - rect.left + 14, ty = e.clientY - rect.top + 14;\n      tip.style.left = Math.min(tx, rect.width - 240) + 'px';\n      tip.style.top = Math.min(ty, rect.height - 110) + 'px';\n    });\n    canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; });\n  }\n  pip(s, lon, lat) {\n    let inside = false;\n    for (const ring of s.p) {\n      for (let i = 0, j = ring.length - 2; i < ring.length; j = i, i += 2) {\n        const xi = ring[i], yi = ring[i + 1], xj = ring[j], yj = ring[j + 1];\n        if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;\n      }\n    }\n    return inside;\n  }\n\n  redrawLand() { if (this._rl) cancelAnimationFrame(this._rl); this._rl = requestAnimationFrame(() => this.drawLandscape()); }\n  redrawSuit() { if (this._rs) cancelAnimationFrame(this._rs); this._rs = requestAnimationFrame(() => this.drawSuit()); }\n\n  renderVals() {\n    const D = this.data;\n    const hb = this.state.hiddenBrand;\n\n    const legend = D ? D.groups.map((g, gi) => {\n      const brands = D.groupBrands[gi];\n      const allHidden = brands.every(b => hb[b]);\n      const color = this.GROUP_COLORS[g] || '#fff';\n      return {\n        gi, name: g.replace(' Group', ''), count: this.groupCounts[gi], color,\n        textColor: allHidden ? 'rgba(232,237,226,0.4)' : '#e8ede2',\n        opacity: allHidden ? 0.5 : 1,\n        hasSub: brands.length > 1,\n        caret: this.state.expanded[gi] ? '▾' : '▸',\n        expanded: !!this.state.expanded[gi],\n        toggleGroup: () => this.setState(st => {\n          const nb = { ...st.hiddenBrand };\n          if (allHidden) brands.forEach(b => delete nb[b]); else brands.forEach(b => nb[b] = true);\n          return { hiddenBrand: nb };\n        }, () => this.redrawLand()),\n        toggleExpand: () => this.setState(st => ({ expanded: { ...st.expanded, [gi]: !st.expanded[gi] } })),\n        brands: brands.map(b => ({\n          name: b, count: this.brandCounts[b] || 0,\n          textColor: hb[b] ? 'rgba(232,237,226,0.4)' : '#e8ede2',\n          border: hb[b] ? 'rgba(255,255,255,0.12)' : color,\n          bg: hb[b] ? 'rgba(255,255,255,0.03)' : 'rgba(120,214,156,0.10)',\n          toggle: () => this.setState(st => {\n            const nb = { ...st.hiddenBrand }; if (nb[b]) delete nb[b]; else nb[b] = true; return { hiddenBrand: nb };\n          }, () => this.redrawLand())\n        }))\n      };\n    }) : [];\n\n    const ovDefs = [\n      { key: 'markets', name: 'Municipal markets', shape: '', ci: 0 },\n      { key: 'centres', name: 'Shopping centres', shape: 'transform:rotate(45deg);', ci: 2 },\n      { key: 'transit', name: 'Transit stops', shape: 'border-radius:50%;', ci: -1 }\n    ];\n    const overlays = ovDefs.map(o => {\n      const on = this.state.overlay[o.key];\n      const col = this.OVL[o.key];\n      return {\n        name: o.name, color: col, shape: o.shape,\n        count: o.ci >= 0 ? this.mktCounts[o.ci] : (D ? D.stations.length : 0),\n        textColor: on ? '#e8ede2' : 'rgba(232,237,226,0.55)',\n        border: on ? col : 'rgba(255,255,255,0.14)',\n        bg: on ? 'rgba(120,214,156,0.08)' : 'rgba(255,255,255,0.04)',\n        toggle: () => this.setState(st => ({ overlay: { ...st.overlay, [o.key]: !st.overlay[o.key] } }), () => this.redrawLand())\n      };\n    });\n\n    const findings = [\n      { tag: 'Mi Alcampo · Aldi · Carrefour Express', text: 'Concentrated in the old town and tourist quarters, nearly absent from residential La Sagrera — leveraging international brand recognition to target visitors rather than compete with local chains in residential neighbourhoods.' },\n      { tag: 'Caprabo', text: 'The legacy local player, dense across the city and especially Les Corts, Fabra i Puig, Sant Gervasi and La Sagrera — a loyal middle-class and affluent base.' },\n      { tag: 'Consum · Charter', text: 'Fewer stores but sharply targeted: near point-to-point competition with Caprabo in Les Corts and Gràcia, won on fresh-food quality, a co-op structure and smart couponing. Charter fills the gaps and remoter districts — Nou Barris, Torre Baró.' },\n      { tag: 'Mercadona · Lidl', text: 'Almost twin footprints; 10–15 minute walking circles give both near-citywide coverage. Both skip Sant Gervasi and Horta-Guinardó (terrain, residents, land value), leaving those areas to smaller formats.' },\n      { tag: 'Dia', text: 'Extreme penetration — wealthy districts, tourist zones and fringes others barely touch (Sant Andreu, Horta-Guinardó), relieving \"food island\" pockets. Early entry (1980), minimal floor-area needs and the 2007 Plus acquisition drove a high-density, low-price network deep into satellite towns.' },\n      { tag: 'Condis', text: 'A franchise policy absorbing many independents; staying under 300 m² keeps stores legally open on Sundays — a structural, displaced-competition advantage.' }\n    ];\n\n    const factorMeta = this.FACTORS.map((f, j) => ({\n      code: f.code, name: f.name, desc: f.desc, canvasId: 'factor-' + j,\n      open: () => this.setState({ zoom: j }, () => requestAnimationFrame(() => this.drawZoom()))\n    }));\n\n    const presets = this.PRESETS.map(p => ({\n      name: p.name,\n      border: 'rgba(255,255,255,0.14)', bg: 'rgba(255,255,255,0.05)', textColor: 'rgba(232,237,226,0.85)',\n      apply: () => this.setState({ weights: p.w.slice() }, () => this.drawSuit())\n    }));\n\n    const sliders = this.FACTORS.map((f, j) => ({\n      name: f.name, value: this.state.weights[j],\n      onInput: e => {\n        const v = +e.target.value;\n        this.setState(st => { const w = st.weights.slice(); w[j] = v; return { weights: w }; }, () => this.redrawSuit());\n      }\n    }));\n\n    const DEF = [25, 12, 8, 8, 6, 8, 15, 10, 8, 8];\n    const groupSliders = this.GROUPS.map(g => {\n      const cur = g.members.map(m => this.state.weights[m]);\n      const sum = cur.reduce((a, b) => a + b, 0);\n      const memberNames = g.members.map(m => this.FACTORS[m].name).join(' + ');\n      return {\n        name: g.name, color: g.color, value: sum, memberNames,\n        onInput: e => {\n          const V = +e.target.value;\n          this.setState(st => {\n            const w = st.weights.slice();\n            const c = g.members.map(m => st.weights[m]);\n            const cs = c.reduce((a, b) => a + b, 0);\n            const base = cs > 0 ? c : g.members.map(m => DEF[m]);\n            const bs = base.reduce((a, b) => a + b, 0) || 1;\n            g.members.forEach((m, i) => { w[m] = Math.round(V * base[i] / bs); });\n            return { weights: w };\n          }, () => this.redrawSuit());\n        }\n      };\n    });\n    const advanced = this.state.advanced;\n    const toggleAdvanced = () => this.setState(st => ({ advanced: !st.advanced }));\n\n    let topCandidates = [];\n    const minPopulation = this.props.minPopulation ?? 500;\n    const candidateCount = this.props.candidateCount ?? 8;\n    if (D) {\n      const sc = this.scores();\n      topCandidates = D.sections.map((s, i) => ({ s, v: sc[i] }))\n        .filter(x => x.s.pop >= minPopulation)\n        .sort((a, b) => b.v - a.v).slice(0, candidateCount)\n        .map((x, r) => ({ rank: r + 1, barri: x.s.b, district: x.s.d, sec: x.s.s, dS: x.s.cn, dM: x.s.dM, score: x.v.toFixed(3) }));\n    }\n\n    const z = this.state.zoom;\n    const zf = z != null ? this.FACTORS[z] : null;\n\n    return {\n      legend, overlays, findings, factorMeta, presets, sliders, topCandidates,\n      groupSliders, advanced, toggleAdvanced, notAdvanced: !advanced,\n      minPopulation, candidateCount,\n      zoomOpen: z != null,\n      zoomCode: zf ? zf.code : '', zoomName: zf ? zf.name : '', zoomDesc: zf ? zf.desc : '', zoomHint: zf ? zf.hint : '',\n      closeZoom: () => this.setState({ zoom: null }),\n      stop: (e) => e.stopPropagation()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
